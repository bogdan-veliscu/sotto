# Implementation DAG. Do not skip waves.

waves:
  - id: 1
    spec: session-store
    name: scaffold
    tasks:
      - id: T1-scaffold
        summary: Tauri 2 + SvelteKit shell, Store, default private settings, public docs
        contract_tests: [CT-no-cloud-default, CT-fixtures-lock]
  - id: 2
    spec: session-store
    name: engine-policy
    depends_on: [1]
    tasks:
      - id: T2-engines
        summary: Catalog + resolve_engine never silently selects cloud
        contract_tests: [CT-no-silent-cloud]
  - id: 3
    spec: capture-consent
    name: consent-gate
    depends_on: [2]
    tasks:
      - id: T3-consent
        summary: recorder.start requires acknowledged consent
        contract_tests: [CT-consent-before-record]
  - id: 4
    spec: capture-consent
    name: encrypt-audio
    depends_on: [3]
    tasks:
      - id: T4-crypto
        summary: Finalize writes AES-GCM ciphertext, not a WAV
        contract_tests: [CT-audio-encrypted]
  - id: 5
    spec: search-notes
    name: fts-export
    depends_on: [4]
    tasks:
      - id: T5-fts
        summary: Fixture transcription, FTS5 search, markdown export
        contract_tests: [CT-fts-search]
  - id: 6
    spec: search-notes
    name: demo-path
    depends_on: [5]
    tasks:
      - id: T6-demo
        summary: make demo, make contract, delete-all
        contract_tests: [CT-delete-all]
  - id: 7
    spec: live-capture
    name: wav-chunks
    depends_on: [6]
    tasks:
      - id: T7-wav-chunks
        summary: record_sine + ChunkedRecorder pause/resume/flush/recover
        contract_tests: [CT-capture-wav, CT-pause-resume, CT-crash-partial, CT-demo-still-offline]
  - id: 8
    spec: live-capture
    name: live-backend
    depends_on: [7]
    tasks:
      - id: T8-mic-error
        summary: start_live(System) returns CAPTURE_UNSUPPORTED recoverable; optional CPAL mic
        contract_tests: [CT-mic-unsupported-is-recoverable]
  - id: 9
    spec: local-stt
    name: whisper-policy
    depends_on: [8]
    tasks:
      - id: T9-whisper-policy
        summary: missing Whisper weights return ENGINE_NOT_INSTALLED; demo never downloads
        contract_tests: [CT-whisper-local-only, CT-demo-no-download]
  - id: 10
    spec: local-stt
    name: whisper-file
    depends_on: [9]
    tasks:
      - id: T10-whisper-file
        summary: present invalid weights return ENGINE_MODEL_INVALID; no HTTP fetch
        contract_tests: [CT-whisper-weights-are-local]
  - id: 11
    spec: model-install
    name: checksum
    depends_on: [10]
    tasks:
      - id: T11-checksum
        summary: install_bytes verifies SHA-256; mismatch leaves no weights file
        contract_tests: [CT-checksum, CT-no-silent-cloud]
  - id: 12
    spec: model-install
    name: parakeet-local
    depends_on: [11]
    tasks:
      - id: T12-parakeet-local
        summary: overlay ready after install; missing is ENGINE_NOT_INSTALLED; delete roundtrip
        contract_tests: [CT-parakeet-local]
  - id: 13
    spec: notes-export
    name: extractive-notes
    depends_on: [12]
    tasks:
      - id: T13-extract
        summary: extract_notes derives summary and follow-ups locally from transcript text
        contract_tests: [CT-summary-from-transcript]
  - id: 14
    spec: notes-export
    name: export-settings
    depends_on: [13]
    tasks:
      - id: T14-export-settings
        summary: write markdown to a local path; privacy_settings default off
        contract_tests: [CT-export-file, CT-settings-privacy]
  - id: 15
    spec: search-filters
    name: date-filter
    depends_on: [14]
    tasks:
      - id: T15-date
        summary: search_filtered inclusive created_at range
        contract_tests: [CT-filter-date]
  - id: 16
    spec: search-filters
    name: tags
    depends_on: [15]
    tasks:
      - id: T16-tags
        summary: tag replace/list and filter-by-tag
        contract_tests: [CT-tag-roundtrip]
  - id: 17
    spec: harden
    name: keystore
    depends_on: [16]
    tasks:
      - id: T17-keychain
        summary: KeyStore file 0600 or macOS Keychain; same key on reopen
        contract_tests: [CT-keychain]
  - id: 18
    spec: harden
    name: retention
    depends_on: [17]
    tasks:
      - id: T18-retention
        summary: retention deletes old sessions; scrub plaintext WAV leftovers
        contract_tests: [CT-retention]
  - id: 19
    spec: desk-closeout
    name: title-filter
    depends_on: [18]
    tasks:
      - id: T19-title-filter
        summary: title substring search without FTS q
        contract_tests: [CT-filter-title]
  - id: 20
    spec: desk-closeout
    name: desk-ui
    depends_on: [19]
    tasks:
      - id: T20-desk-ui
        summary: invoke guard, engines, filters, delete-all, wrap header
        contract_tests: [CT-filter-title]
  - id: 21
    spec: live-record
    name: live-stop
    depends_on: [20]
    tasks:
      - id: T21-live-stop
        summary: finalize_live encrypts chunk WAV, not CONSULT-001
        contract_tests: [CT-live-stop-not-fixture]
  - id: 22
    spec: live-record
    name: desk-live
    depends_on: [21]
    tasks:
      - id: T22-desk-live
        summary: recorder_stop + mic begin; fixture-replay rejects live audio
        contract_tests: [CT-fixture-audio-mismatch]
  - id: 23
    spec: presence
    name: hud-model
    depends_on: [22]
    tasks:
      - id: T23-hud-model
        summary: hud_from_status LED and clock
        contract_tests: [CT-hud-recording]
  - id: 24
    spec: presence
    name: login-tray
    depends_on: [23]
    tasks:
      - id: T24-login-tray
        summary: login-item backend + settings + tray/HUD
        contract_tests: [CT-login-item-backend]
  - id: 25
    spec: hotkey
    name: parse
    depends_on: [24]
    tasks:
      - id: T25-parse
        summary: parse_hotkey rejects empty; default is CommandOrControl+Shift+Space
        contract_tests: [CT-hotkey-parse]
  - id: 26
    spec: hotkey
    name: mode
    depends_on: [25]
    tasks:
      - id: T26-mode
        summary: toggle or ptt; desk listens without skipping consent
        contract_tests: [CT-hotkey-mode]
  - id: 27
    spec: meeting-detect
    name: classify
    depends_on: [26]
    tasks:
      - id: T27-classify
        summary: classify_processes Zoom/Teams/Slack from injected names
        contract_tests: [CT-meeting-detect-apps]
  - id: 28
    spec: meeting-detect
    name: ask
    depends_on: [27]
    tasks:
      - id: T28-ask
        summary: should_prompt never silent-starts; consent still required
        contract_tests: [CT-meeting-never-silent]
  - id: 29
    spec: system-audio
    name: tap-status
    depends_on: [28]
    tasks:
      - id: T29-status
        summary: system_tap_status is unsupported off macOS and honest on macOS
        contract_tests: [CT-system-tap-status]
  - id: 30
    spec: system-audio
    name: tap-live
    depends_on: [29]
    tasks:
      - id: T30-tap
        summary: start_live(System) never uses CONSULT-001; unsupported stays recoverable
        contract_tests: [CT-system-not-fixture]
  - id: 31
    spec: mixed-capture
    name: no-fallback
    depends_on: [30]
    tasks:
      - id: T31-no-fallback
        summary: start_live(Mixed) fails unless both backends can open; never mic-only
        contract_tests: [CT-mixed-not-mic-only]
  - id: 32
    spec: mixed-capture
    name: mix-pcm
    depends_on: [31]
    tasks:
      - id: T32-mix-pcm
        summary: mix_pcm saturating-average of both lanes
        contract_tests: [CT-mix-pcm]
  - id: 33
    spec: parakeet-runtime
    name: runtime-status
    depends_on: [32]
    tasks:
      - id: T33-status
        summary: parakeet_runtime_status is not-built unless a decoder is compiled in
        contract_tests: [CT-parakeet-runtime-status]
  - id: 34
    spec: parakeet-runtime
    name: not-fixture
    depends_on: [33]
    tasks:
      - id: T34-not-fixture
        summary: Parakeet transcribe never returns CONSULT-001 golden text
        contract_tests: [CT-parakeet-not-fixture]
  - id: 35
    spec: stt-worker
    name: releases-lock
    depends_on: [34]
    tasks:
      - id: T35-lock
        summary: Store mutex is free during transcribe_local
        contract_tests: [CT-stt-worker-releases-lock]
  - id: 36
    spec: stt-worker
    name: same-result
    depends_on: [35]
    tasks:
      - id: T36-result
        summary: transcribe_job matches Store::transcribe; demo stays fixture-replay
        contract_tests: [CT-stt-worker-same-result]
