[package]
name = "sotto"
version = "0.1.0"
description = "Local-first meeting recorder. No bot. Audio stays on this Mac."
authors = ["Bogdan Veliscu"]
edition = "2021"
license = "MIT"
default-run = "sotto"

[lib]
name = "sotto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sotto"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "sotto-demo"
path = "src/bin/demo.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:tauri-plugin-autostart", "dep:tauri-plugin-global-shortcut", "dep:tauri-build", "whisper", "parakeet"]
# Optional on-device Whisper inference. Pulls whisper-rs/ggml. Off by default
# and off on Linux CI (`cargo test --no-default-features`) so core contract
# tests never compile ggml. Weights are always local; nothing downloads.
whisper = ["dep:whisper-rs"]
# Optional on-device Parakeet TDT decoder via ONNX Runtime. Off on Linux CI.
# A dummy `.bin` is not a model. Real weights are a local TDT directory.
parakeet = ["dep:parakeet-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
directories = "5"
whisper-rs = { version = "0.12", optional = true }
parakeet-rs = { version = "0.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"
cpal = "0.15"
screencapturekit = { version = "9.0.1", features = ["macos_13_0"] }

[dev-dependencies]
tempfile = "3"
